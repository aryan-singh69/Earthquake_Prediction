batch_size: 256
epochs: 10
head_lr: 1e-3
finetune_lr: 1e-4
freeze_encoder_epochs: 3
detection_loss_weight: 1.0
phase_loss_weight: 5.0
magnitude_loss_weight: 3.0
location_loss_weight: 0.0
use_location_head: false
use_cached_data: true

csv_path: data/raw/merge.csv
hdf5_path: data/raw/merge.hdf5
cache_dir: data/processed/cache
chunk_size: 10000
max_train_samples: 0
max_val_samples: 0
cached_chunks_in_memory: 2
pretrained_path: models/checkpoints/best_model.pth
save_path: models/checkpoints/multitask_model_improved.pth
patience: 4
num_workers: 4
val_num_workers: 0
pin_memory: true
persistent_workers: true
prefetch_factor: 2
perf_log_interval: 50
